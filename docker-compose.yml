version: "3.9"

services:
  # PostgreSQL + PostGIS — основная база данных игры
  db:
    image: postgis/postgis:16-3.4
    container_name: rolypoly_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rolypoly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rolypoly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rolypoly}
    ports:
      - "5432:5432"
    volumes:
      - rolypoly_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rolypoly} -d ${POSTGRES_DB:-rolypoly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rolypoly_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-rolypoly}:${POSTGRES_PASSWORD:-rolypoly_dev_password}@db:5432/${POSTGRES_DB:-rolypoly}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-true}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Frontend (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rolypoly_frontend
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  rolypoly_db_data:
