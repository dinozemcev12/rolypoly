[alembic]
# path to migration scripts
script_location = migrations

# database driver
sqlalchemy.url = driver://user:pass@localhost/dbname

# version location
version_locations = %(here)s/migrations/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the
# "version code" fraction of the "version_id"
max_version_code_length = 32

# template used to generate migration files
# %s will be replaced with the version code, %d with the date, %t with time
file_template = %%(rev)s_%%(slug)s

# version code separator
version_code_separator = _

# the version table name
version_table = alembic_version

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated migration scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console
# script = black console
# type = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(asctime)s] %(name)s: %(message)s
datefmt = %H:%M:%S
